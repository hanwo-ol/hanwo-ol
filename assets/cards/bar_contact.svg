    <rect x="0" y="0" width="48" height="48" rx="12" fill="#141414" stroke="#333333" stroke-width="1"/>
    <g transform="translate(13, 13)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h14c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
