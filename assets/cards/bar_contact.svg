      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="50%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#202020"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-15%" width="106%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="508" height="80" rx="16" ry="16" fill="url(#barGrad)" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>

