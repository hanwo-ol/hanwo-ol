<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%">
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="50%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
    <filter id="btnShadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Button Body -->
  <rect x="4" y="4" width="312" height="52" rx="26" ry="26" fill="url(#btnGrad)" stroke="#444444" stroke-width="1.5" filter="url(#btnShadow)"/>

  <!-- Left Arrow Icon Circle -->
  <g transform="translate(14, 12)">
    <circle cx="18" cy="18" r="18" fill="#141414" stroke="#383838"/>
    <g transform="translate(9, 9)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="14" y1="9" x2="4" y2="9"/>
      <polyline points="9 4 4 9 9 14"/>
    </g>
  </g>

  <!-- Button Label -->
  <text x="64" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3">메인 대시보드로 돌아가기</text>
  <text x="288" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#D4D4D4">HOME</text>
</svg>
