<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 92" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="50%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#202020"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-15%" width="106%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="508" height="80" rx="16" ry="16" fill="url(#barGrad)" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Icon Container -->
  <g transform="translate(20, 22)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#141414" stroke="#333333" stroke-width="1"/>
    <g transform="translate(13, 13)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 2 2 7 11 12 20 7 11 2"/>
      <polyline points="2 16 11 21 20 16"/>
      <polyline points="2 11 11 16 20 11"/>
    </g>
  </g>

  <!-- Text: Title & Subtitle -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">Research Projects</text>
  <text x="82" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#D4D4D4">주요 연구 과제</text>

  <!-- Right Indicator -->
  <g transform="translate(462, 30)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="16" stroke="#333333" fill="#141414"/>
    <path d="M13 16h6m-3-3 3 3-3 3"/>
  </g>
</svg>
